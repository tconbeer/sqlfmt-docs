name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: sqlfmt-docs:ci

      - name: Run image and check key routes
        run: |
          docker run -d --name sqlfmt-docs -p 3000:3000 sqlfmt-docs:ci
          for attempt in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done
          for path in / /docs/intro /docs/getting-started/installation /sitemap.xml /img/favicon.ico; do
            curl -fsS -o /dev/null -w "%{http_code} $path\n" "http://127.0.0.1:3000$path"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/this-page-does-not-exist)" = 404
          curl -fsS http://127.0.0.1:3000/ | grep -q "sqlfmt formats your dbt SQL files"

      - name: Container logs
        if: always()
        run: docker logs sqlfmt-docs || true
