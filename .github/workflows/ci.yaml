name: CI

on:
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Build and smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run build

      - run: npm run test:e2e
        env:
          PLAYWRIGHT_CHANNEL: chrome

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 7

  docker:
    name: Docker image smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@v4

      - name: Build image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: sqlfmt-docs:ci

      - name: Run image
        run: |
          # Compose publishes 3000; Traefik routes to 80, the lowest exposed port.
          docker run -d --name sqlfmt-docs -p 3000:3000 -p 8080:80 sqlfmt-docs:ci
          for attempt in $(seq 1 30); do
            curl -fsS -o /dev/null http://127.0.0.1:3000/ && break
            sleep 1
          done

      - name: Check routes and headers
        run: |
          base=http://127.0.0.1:3000
          for path in / /docs/intro /docs/intro/ /docs/api /docs/api/ /docs/getting-started/installation /sitemap.xml /img/favicon.ico; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$base$path")
            echo "$code $path"
            test "$code" = 200
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/docs/intro)" = 200
          test "$(curl -s -o /dev/null -w '%{http_code}' "$base/this-page-does-not-exist")" = 404
          curl -fsS "$base/" | grep -q "sqlfmt formats your dbt SQL files"
          asset=$(curl -fsS "$base/" | grep -o '/assets/js/main\.[0-9a-f]*\.js' | head -1)
          test -n "$asset"
          curl -fsSI "$base$asset" | grep -qi '^cache-control: public, max-age=31536000, immutable'
          curl -fsSI "$base/docs/intro" | grep -qi '^cache-control: no-cache'

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Run smoke tests against the image
        run: npm run test:e2e
        env:
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:3000
          PLAYWRIGHT_CHANNEL: chrome

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-docker-test-results
          path: test-results/
          retention-days: 7

      - name: Container logs
        if: always()
        run: docker logs sqlfmt-docs || true
